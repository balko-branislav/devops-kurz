name: CI/CD - Build and Push to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kodu
        uses: actions/checkout@v4

      - name: Prihlasenie do Docker Hubu
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Zostavenie a publikacia Docker Obrazu
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/moja-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/moja-app:${{ github.sha }}name: CI - Docker Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kodu z repozitara
        uses: actions/checkout@v4

      - name: Zostavenie Docker Obrazu
        run: |
          docker build -t moja-app:${{ github.sha }} .

      - name: Testovacie spustenie kontajnera
        run: |
          docker run -d -p 8080:80 --name test-app moja-app:${{ github.sha }}
          sleep 5
          docker ps | grep test-app

