name: CI - Docker Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kodu z repozitara
        uses: actions/checkout@v4

      - name: Zostavenie Docker Obrazu
        run: |
          docker build -t moja-app:${{ github.sha }} .

      - name: Testovacie spustenie kontajnera
        run: |
          docker run -d -p 8080:80 --name test-app moja-app:${{ github.sha }}
          sleep 5
          docker ps | grep test-app

