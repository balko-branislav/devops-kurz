name: Terraform CI/CD

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Stiahnutie kodu
        uses: actions/checkout@v4

      - name: Nastavenie Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Kontrola formátovania kódu
        run: terraform fmt -check

      - name: Inicializácia Terraformu
        run: terraform init

      - name: Náhľad zmien (Plan)
        run: terraform plan
